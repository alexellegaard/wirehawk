# =====================================================================
# DEBUG SAFETY LIMITS (temporarily lowered for hold-then-slow-move integration).
# PRODUCTION values to restore when debugging is done:
#   max_speed  10485760.0  (80 rev/s)
#   max_accel   6553600.0  (50 rev/s^2)
#   max_step    5000000    (~2.4 m)
# =====================================================================
ethercat_bridge:
  ros__parameters:
    interface: "eth0"            # EtherCAT NIC on the master machine
    cycle_ns: 4000000            # 4 ms EtherCAT cycle (16 x 250 us). 125 Hz (8 ms) overshot: the
                                 # clock-jitter benefit flattened out but the position loop got coarse
                                 # (0.15 rev/update at 5 m/s), so even the clean motor rippled. 4 ms is
                                 # the sweet spot: 4x less clock jitter than 1 kHz, still a fine loop.
    counts_per_rev: 131072       # A6-1000EC 17-bit encoder
    num_motors: 4                # 4 motors = anchors 0-3 (full CDPR)
    rt_cpu: 3                    # isolated core the RT thread is pinned to
    max_speed: 500000.0           # DEBUG ~3.8 rev/s (0.26-0.65 m/s). PRODUCTION: 10485760.0 (80 rev/s; 6000 rpm = 100 rev/s max)
    max_accel: 50000.0           # DEBUG ~0.38 rev/s^2 slow ramp. PRODUCTION: 6553600.0 (50 rev/s^2).
    pos_feedback_gain: 20.0      # 1/s: position drift correction on top of the interpolator's velocity
                                 # feedforward. Feedforward = d(cmd)/dt at the 100 Hz command rate; this
                                 # small term closes residual position drift without the sawtooth.
    gear_ratio: 1.0              # motor revolutions per drum revolution
    mast_run: 3.0                # winch-drum -> top-pulley cable [m]. The fixed cable that is always out,
                                 # independent of the TCP. The bridge subtracts it, so it publishes the free
                                 # span (anchor/pulley -> TCP), never the total paid-out length.
    spool_total_m: 65.0          # cable inventory per winch [m]
    spool_core_d_m: 0.020        # drum core diameter [m]
    spool_rope_d_m: 0.002        # cable diameter [m]
    spool_turns_per_layer: 70    # turns per layer (ideal square packing)
    spool_max_layers: 9          # max winding layers
    # raw 0x6064 at "rope end at the pulley", in SLAVE order (0=mast1, 1=mast2,
    # 2=mast3, 3=mast4 — the CW daisy-chain). Logged once via log_zeros.py; only
    # changes if a spool is replaced or a drive is re-homed. Battery-backed
    # multi-turn encoder => survives power cycles.
    zero_ticks: [-159866262, -72631542, -137708708, 13605204]

    direction: [-1, -1, -1, -1]  # per-motor winding sign: +1 = normal (positive counts = cable winds IN),
                                 # -1 = reversed. Negates that motor's logical counts on both command and
                                 # feedback. SIM DOESN'T NEED THIS (always forward).
    max_step: 50000              # DEBUG ~2.6-6.5 cm hard cap on target distance from current position.
                                 # PRODUCTION: 5000000 (~2.4 m). Clamps a runaway wind-in from a wrong
                                 # calibration to a safe step. 0 = disabled.
    max_following_error: 1000000 # counts (~0.48 m): watchdog. If a drive's actual position strays this far from its
                                 # commanded target, the bridge disables ALL motors and latches until restart.
                                 # 0 = disabled.
    max_torque: 300              # torque watchdog (0.1% rated: 1000 = 100% rated). If any drive's |0x6077| exceeds
                                 # this, disable ALL motors + latch until restart. 0 = disabled.
                                 # TUNE: set ~2-3x the observed holding torque at 1 kg (watch /real/state/motors).
