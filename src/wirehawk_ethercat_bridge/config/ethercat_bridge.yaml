ethercat_bridge:
  ros__parameters:
    interface: "eth0"            # EtherCAT NIC on the master machine
    cycle_ns: 4000000            # 4 ms EtherCAT cycle (16 x 250 us). Lowered from 1 ms: control is
                                 # ~100 Hz so 1 kHz SYNC0 was overkill, and the slave-2 clock jitter
                                 # (2.7 us absolute) is a smaller RELATIVE fraction of a longer cycle
                                 # -> ~4x less velocity noise on the daisy-chained drive.
    counts_per_rev: 131072       # A6-1000EC 17-bit encoder
    num_motors: 2                # bench: 2 motors = anchor 0 + anchor 1
    rt_cpu: 3                    # isolated core the RT thread is pinned to
    max_speed: 6553600.0         # counts/s  (50 rev/s = drive rated 3000 rpm; ~3.1 m/s cable at core layer)
    max_accel: 20000000.0        # counts/s^2 (reaches 50 rev/s in ~0.3 s)
    counts_offset: [0, 0]           # fixed bias on top of auto-zero (0 = mirror current pose on enable).
                                    # Auto-zero latches raw−logical at each enable, so no absolute
                                    # zero is needed on the bench (motors move between sessions).
