ethercat_bridge:
  ros__parameters:
    interface: "eth0"            # EtherCAT NIC on the master machine
    cycle_ns: 4000000            # 4 ms EtherCAT cycle (16 x 250 us). 125 Hz (8 ms) overshot: the
                                 # clock-jitter benefit flattened out but the position loop got coarse
                                 # (0.15 rev/update at 5 m/s), so even the clean motor rippled. 4 ms is
                                 # the sweet spot: 4x less clock jitter than 1 kHz, still a fine loop.
    counts_per_rev: 131072       # A6-1000EC 17-bit encoder
    num_motors: 4                # 4 motors = anchors 0-3 (full CDPR)
    rt_cpu: 3                    # isolated core the RT thread is pinned to
    max_speed: 10485760.0         # counts/s  (80 rev/s; 5 m/s TCP worst-case needs 79.6 rev/s; 6000 rpm = 100 rev/s max)
    max_accel: 6553600.0         # counts/s^2 = 50 rev/s^2 (x131072). Matches 3 m/s^2 task accel (48 rev/s^2 needed). C-sweep history:
                                 # 45 rev/s at 20 rev/s^2 was "very slight jump, usable"; 45 gave a
                                 # metallic bump. 20M (152 rev/s^2) made WASD steps effectively instant
                                 # accel = the start jump. Reaches 50 rev/s in 2.5 s (gentler ramp).
    pos_feedback_gain: 20.0      # 1/s: position drift correction on top of the interpolator's velocity
                                 # feedforward. Feedforward = d(cmd)/dt at the 100 Hz command rate; this
                                 # small term closes residual position drift without the sawtooth the old
                                 # v=err/dt form produced on a staircase target.
    counts_offset: [0, 0, 0, 0]     # fixed bias on top of auto-zero (0 = mirror current pose on enable).
                                    # Auto-zero latches raw−logical at each enable, so no absolute
                                    # zero is needed on the bench (motors move between sessions).
