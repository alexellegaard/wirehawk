# =====================================================================
# DEBUG SAFETY LIMITS (temporarily lowered for hold-then-slow-move integration).
# PRODUCTION values to restore when debugging is done:
#   cdpr_node: linear_speed 5.0, linear_accel 3.0, linear_decel 2.0,
#              cable_speed 6.0, cable_accel 4.0
#   trajectory_planner: linear_speed 5.0, linear_accel 3.0
#   keyboard_teleop:    linear_speed 5.0, linear_accel 4.0
# =====================================================================
# Wirehawk control params — world: field (field, non-square quadrilateral)
# Anchors in slave order (a0=mast1=slave1 ... a3=mast4=slave4), z = top-pulley height.
cdpr_node:
  ros__parameters:
    anchors: [-7.3222, -11.1349, 3.0000, -10.9113, 13.5478, 3.0000, 9.0137, 8.7221, 3.0000, 9.2198, -11.1349, 3.0000]
    start_position: [-1.0966, -1.1147, 1.2000]
    workspace_min: [-9.9113, -10.1349, 0.3000]
    workspace_max: [8.2198, 12.5478, 2.7000]
    max_linear_speed: 0.2
    max_linear_accel: 0.2
    max_linear_decel: 0.2
    max_cable_speed: 0.3           # [m/s] DEBUG slow. PRODUCTION: 6.0
    max_cable_accel: 0.3           # [m/s^2] DEBUG slow. PRODUCTION: 4.0
    rate_hz: 50.0
    cmd_timeout: 0.2
    cable_axial_stiffness: 98100.0
    payload_mass: 0.1             # actual hawk mass (~100 g). Was 3.0 — a heavy-payload assumption made the elastic FK hang the TCP too low
    tcp_attachment_length: 0.25  # [m] elastic band between the rope end and the TCP. The bridge reports
                                 # anchor->rope-end length; the FK needs anchor->TCP, so this is added.
    fk_gain: 0.5

trajectory_planner:
  ros__parameters:
    max_linear_speed: 0.2
    max_linear_accel: 0.2
    goal_tolerance: 0.02
    decel_distance: 0.3
    rate_hz: 50.0

keyboard_teleop:
  ros__parameters:
    max_linear_speed: 0.2
    max_linear_accel: 0.2
    rate_hz: 30.0

bird_sweeper:
  ros__parameters:
    workspace_min: [-9.9113, -10.1349, 0.3000]
    workspace_max: [8.2198, 12.5478, 2.7000]
    max_decel: 2.0
    lateral_gain: 0.5
    scare_radius: 0.0
