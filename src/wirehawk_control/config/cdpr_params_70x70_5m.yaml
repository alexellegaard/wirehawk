# Wirehawk control params — world: 70x70 m footprint, 5 m masts (anchors z=5.0)
# Anchors MUST match the pillar layout in wirehawk_world_70x70_5m.sdf
cdpr_node:
  ros__parameters:
    anchors: [35.0, 35.0, 5.0, 35.0, -35.0, 5.0, -35.0, -35.0, 5.0, -35.0, 35.0, 5.0]
    start_position: [0.0, 0.0, 1.5]
    workspace_min: [-25.0, -25.0, 0.3]
    workspace_max: [25.0, 25.0, 4.7]
    max_linear_speed: 1.0
    max_linear_accel: 0.5
    rate_hz: 50.0
    cmd_timeout: 0.2
    # Elastic-FK feedback (calibration copies matching the world SDF cable/payload params)
    cable_axial_stiffness: 98100.0    # EA [N] — must match <axial_stiffness> in the world SDF
    payload_mass: 3.0                 # [kg] — must match the payload mass in the world SDF
    fk_gain: 0.1                      # [1/s] integral feedback gain (tunable)

trajectory_planner:
  ros__parameters:
    max_linear_speed: 0.8
    max_linear_accel: 1.0
    goal_tolerance: 0.02
    decel_distance: 0.3
    rate_hz: 50.0
